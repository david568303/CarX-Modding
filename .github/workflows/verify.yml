name: Verify source
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x
      - name: Python tests without proprietary fixtures
        shell: pwsh
        run: |
          python -m pip install -r src/ApiResolver/requirements.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($suite in 'ApiResolver','MetadataNormalizer','NoSymbols') {
            python -B -m unittest discover -s "tests/$suite" -v
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Managed bootstrap tests
        shell: pwsh
        run: |
          dotnet run --project tests/MetadataBootstrap -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build loader and test native resolver
        shell: pwsh
        run: |
          ./tools/build-doorstop.ps1 -Release
          ./tests/native/run.ps1
          dotnet build src/MetadataBootstrap -c Release --nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
